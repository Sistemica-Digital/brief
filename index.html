<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistémica Digital | Ecosistema Comercial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0B1B3D;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }
    .card {
      background: #15274D;
      border: 1px solid #233863;
      border-top: 4px solid #D49B28;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    img { max-height: 70px; margin-bottom: 1.5rem; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    p { color: #94A3B8; font-size: 0.95rem; margin-bottom: 2rem; }
    .btn {
      display: block;
      background: #D49B28;
      color: #0B1B3D;
      text-decoration: none;
      font-weight: 800;
      padding: 0.9rem 1.5rem;
      border-radius: 10px;
      margin-bottom: 1rem;
      transition: all 0.2s;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #233863;
      color: #FFFFFF;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.png" alt="Sistémica Digital" onerror="this.style.display='none'">
    <h1>Sistémica Digital</h1>
    <p>Infraestructura, campañas de alto rendimiento y automatización para negocios B2B y E-commerce.</p>
    
    <a href="./brief/" class="btn">📋 Completar Brief Estratégico</a>
    <a href="./acceso/" class="btn btn-secondary">🔒 Asignación de Activos Meta Ads</a>
  </div>
</body>
</html>
